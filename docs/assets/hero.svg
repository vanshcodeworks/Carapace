<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Carapace: local execution sandbox for untrusted code</title>
  <desc id="heroDesc">Animated diagram showing an agent request entering an isolated sandbox with resource boundaries and the host remaining protected.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080c"/>
      <stop offset="0.4" stop-color="#080d14"/>
      <stop offset="1" stop-color="#0a1018"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d151f"/>
      <stop offset="1" stop-color="#070e14"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e676"/>
      <stop offset="1" stop-color="#00a85e"/>
    </linearGradient>
    <linearGradient id="warnGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb300"/>
      <stop offset="1" stop-color="#ff8f00"/>
    </linearGradient>
    <linearGradient id="hostGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141e2a"/>
      <stop offset="1" stop-color="#0b141c"/>
    </linearGradient>
    <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowWarn" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softPulse" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .dim { fill: #5a6e82; }
      .fg { fill: #c8d4e0; }
      .green { fill: #00e676; }
      .warn { fill: #ffb300; }
      .red { fill: #ff5252; }
      .small { font-size: 12px; }
      .body { font-size: 15px; }
      .title { font-size: 20px; font-weight: 600; }
      .line { stroke: #1e2d3d; stroke-width: 1; }
      .grid { stroke: #121f2b; stroke-width: 0.5; }
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#bgGrad)"/>

  <g opacity="0.25" class="grid">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200"/>
    <path d="M60 0 V420 M180 0 V420 M300 0 V420 M420 0 V420 M540 0 V420 M660 0 V420 M780 0 V420 M900 0 V420 M1020 0 V420 M1140 0 V420"/>
  </g>

  <g>
    <circle cx="100" cy="40" r="2.5" fill="#00e676" opacity="0.7">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1100" cy="50" r="2" fill="#00e676" opacity="0.6">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="380" r="2" fill="#00e676" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="350" r="1.5" fill="#00e676" opacity="0.4">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g>
    <rect x="40" y="30" width="500" height="360" rx="14" fill="url(#panelGrad)" stroke="#1e2d3d" stroke-width="1.5"/>
    <path d="M40 70 H540" class="line"/>
    <circle cx="68" cy="50" r="6" fill="#ff5252"/>
    <circle cx="88" cy="50" r="6" fill="#ffb300"/>
    <circle cx="108" cy="50" r="6" fill="#00e676"/>
    <text x="132" y="55" class="mono small dim">cara run -- /usr/bin/python3 agent.py</text>
    <g filter="url(#glowGreen)">
      <rect x="454" y="40" width="66" height="22" rx="11" fill="#062018" stroke="#005d3a"/>
      <text x="487" y="55" text-anchor="middle" class="mono" font-size="10" fill="#00e676">LOCAL</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.1;0.25;0.3;1" dur="10s" repeatCount="indefinite"/>
      <text x="60" y="106" class="mono body dim">$ cara run -- /usr/bin/python3 agent.py</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.38;0.55;0.6;1" dur="10s" repeatCount="indefinite"/>
      <text x="60" y="142" class="mono body fg">agent requests: /home, network, disk</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.58;0.66;0.8;0.85;1" dur="10s" repeatCount="indefinite"/>
      <text x="60" y="180" class="mono body red">carapace: denied</text>
      <rect x="200" y="164" width="96" height="26" rx="13" fill="#250e14" stroke="#6b1520"/>
      <text x="248" y="182" text-anchor="middle" class="mono" font-size="11" fill="#ff5252">fail closed</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8;0.88;1;1;1" dur="10s" repeatCount="indefinite"/>
      <text x="60" y="218" class="mono body green">exit 126  |  host files changed: 0</text>
    </g>

    <g opacity="0.9">
      <rect x="60" y="270" width="90" height="32" rx="16" fill="#062018" stroke="#005d3a"/>
      <text x="105" y="291" text-anchor="middle" class="mono" font-size="12" fill="#00e676">no root</text>
      <rect x="162" y="270" width="100" height="32" rx="16" fill="#062018" stroke="#005d3a"/>
      <text x="212" y="291" text-anchor="middle" class="mono" font-size="12" fill="#00e676">no docker</text>
      <rect x="274" y="270" width="108" height="32" rx="16" fill="#062018" stroke="#005d3a"/>
      <text x="328" y="291" text-anchor="middle" class="mono" font-size="12" fill="#00e676">~7 ms cold</text>
    </g>

    <g opacity="0.9">
      <rect x="60" y="315" width="160" height="32" rx="16" fill="#1a2a38" stroke="#1e2d3d"/>
      <text x="140" y="336" text-anchor="middle" class="mono" font-size="12" fill="#5a6e82">Tier 1 native</text>
      <rect x="232" y="315" width="130" height="32" rx="16" fill="#1a2a38" stroke="#1e2d3d"/>
      <text x="297" y="336" text-anchor="middle" class="mono" font-size="12" fill="#5a6e82">Tier 2 wasm</text>
      <rect x="374" y="315" width="130" height="32" rx="16" fill="#1a2a38" stroke="#1e2d3d"/>
      <text x="439" y="336" text-anchor="middle" class="mono" font-size="12" fill="#5a6e82">Tier 3 microVM</text>
    </g>

    <rect x="60" y="90" width="8" height="16" fill="#00e676" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0;0.7" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g>
    <path d="M560 200 H640" stroke="#1e2d3d" stroke-width="1.5" stroke-dasharray="5 7"/>
    <circle r="3.5" fill="#00e676" filter="url(#glowGreen)">
      <animateMotion dur="3.5s" repeatCount="indefinite" path="M560 200 L640 200"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g>
    <circle cx="900" cy="195" r="100" fill="none" stroke="#00e676" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="82;115" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="195" r="100" fill="none" stroke="#00e676" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="82;115" dur="4s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0" dur="4s" begin="2s" repeatCount="indefinite"/>
    </circle>

    <path d="M900 80 L980 110 L980 185 C980 245 940 280 900 300 C860 280 820 245 820 185 L820 110 Z" fill="url(#hostGrad)" stroke="#00e676" stroke-width="2.5"/>
    <path d="M900 92 L968 119 L968 185 C968 233 936 262 900 278 C864 262 832 233 832 185 L832 119 Z" fill="none" stroke="#005d3a" stroke-width="1" opacity="0.5"/>

    <g filter="url(#softPulse)" opacity="0.3">
      <rect x="870" y="180" width="60" height="52" rx="10" fill="#00e676"/>
    </g>
    <path d="M880 180 v-18 a18 18 0 0 1 36 0 v18" fill="none" stroke="#00e676" stroke-width="4.5" stroke-linecap="round"/>
    <rect x="868" y="180" width="64" height="52" rx="10" fill="#0a1a24" stroke="#00e676" stroke-width="2"/>
    <circle cx="900" cy="204" r="5" fill="#00e676"/>
    <path d="M900 209 v11" stroke="#00e676" stroke-width="3.5" stroke-linecap="round"/>

    <text x="900" y="370" text-anchor="middle" class="sans" font-size="21" font-weight="600" fill="#c8d4e0">Your machine</text>
    <text x="900" y="398" text-anchor="middle" class="sans" font-size="21" font-weight="600" fill="#00e676">stays yours</text>
  </g>

  <text x="40" y="405" class="mono" font-size="11" fill="#4a5e72">one binary  |  no daemon  |  no root</text>
  <text x="1160" y="405" text-anchor="end" class="mono" font-size="11" fill="#4a5e72">tier 1 native linux</text>
</svg>