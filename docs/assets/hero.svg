<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Carapace: a local sandbox for code written by AI agents</title>
  <desc id="heroDesc">An animated terminal shows agent code being blocked by Carapace while the host machine stays safe.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1628"/>
      <stop offset="1" stop-color="#101d33"/>
    </linearGradient>
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1a2d"/>
      <stop offset="1" stop-color="#081321"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123049"/>
      <stop offset="1" stop-color="#0a1b2d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .dim { fill: #8b9bb4; }
      .white { fill: #e6edf7; }
      .green { fill: #5eead4; }
      .red { fill: #fb7185; }
      .blue { fill: #7dd3fc; }
      .small { font-size: 13px; }
      .body { font-size: 16px; }
      .line { stroke: #24314a; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1200" height="460" fill="url(#bg)"/>

  <g opacity="0.35">
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200 M0 320 H1200 M0 400 H1200" stroke="#16243a" stroke-width="1"/>
    <path d="M80 0 V460 M240 0 V460 M400 0 V460 M560 0 V460 M720 0 V460 M880 0 V460 M1040 0 V460" stroke="#122035" stroke-width="1"/>
  </g>

  <g>
    <circle cx="120" cy="52" r="3" fill="#5eead4" opacity="0.8">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="74" r="2.5" fill="#38bdf8" opacity="0.7">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="410" r="2.5" fill="#5eead4" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g>
    <rect x="40" y="60" width="720" height="340" rx="18" fill="url(#term)" stroke="#24314a" stroke-width="1.5"/>
    <path d="M40 100 H760" class="line"/>
    <circle cx="68" cy="80" r="6" fill="#fb7185"/>
    <circle cx="88" cy="80" r="6" fill="#fbbf24"/>
    <circle cx="108" cy="80" r="6" fill="#34d399"/>
    <text x="132" y="85" class="mono small dim">carapace / safe run</text>
    <g filter="url(#glow)">
      <rect x="654" y="70" width="86" height="22" rx="11" fill="#0b2a28" stroke="#1f6f66"/>
      <text x="697" y="85" text-anchor="middle" class="mono" font-size="11" fill="#5eead4">LOCAL</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.08;0.18;0.22;1" dur="9s" repeatCount="indefinite"/>
      <text x="70" y="136" class="mono body dim">$ cara run -- /usr/bin/python3 agent.py</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.18;0.24;0.34;0.38;1" dur="9s" repeatCount="indefinite"/>
      <text x="70" y="174" class="mono body white">agent wants: /home, sockets, disk</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.36;0.42;0.56;0.60;1" dur="9s" repeatCount="indefinite"/>
      <text x="70" y="212" class="mono body red">carapace: denied</text>
      <rect x="232" y="196" width="108" height="26" rx="13" fill="#2a1018" stroke="#7f1d2e"/>
      <text x="286" y="214" text-anchor="middle" class="mono" font-size="12" fill="#fb7185">fail closed</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.58;0.64;0.82;0.86;1" dur="9s" repeatCount="indefinite"/>
      <text x="70" y="250" class="mono body green">exit 126  |  host files changed: 0</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.62;0.68;0.92;0.96;1" dur="9s" repeatCount="indefinite"/>
      <rect x="70" y="272" width="220" height="34" rx="17" fill="#0b2a28" stroke="#1f6f66"/>
      <path d="M88 289 l6 6 l12 -14" fill="none" stroke="#5eead4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="116" y="294" class="mono" font-size="14" fill="#5eead4">sandbox intact</text>
    </g>

    <g opacity="0.9">
      <rect x="70" y="330" width="96" height="34" rx="17" fill="#0a1728" stroke="#24314a"/>
      <text x="118" y="352" text-anchor="middle" class="mono" font-size="13" fill="#8b9bb4">no root</text>
      <rect x="178" y="330" width="112" height="34" rx="17" fill="#0a1728" stroke="#24314a"/>
      <text x="234" y="352" text-anchor="middle" class="mono" font-size="13" fill="#8b9bb4">no docker</text>
      <rect x="302" y="330" width="118" height="34" rx="17" fill="#0a1728" stroke="#24314a"/>
      <text x="361" y="352" text-anchor="middle" class="mono" font-size="13" fill="#8b9bb4">~7 ms cold</text>
    </g>

    <rect x="70" y="120" width="8" height="16" fill="#5eead4" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0;0.7" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g>
    <path d="M770 232 H842" stroke="#2a3b57" stroke-width="1.5" stroke-dasharray="5 7"/>
    <circle r="4" fill="#5eead4" filter="url(#glow)">
      <animateMotion dur="3.2s" repeatCount="indefinite" path="M770 232 L842 232"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g>
    <circle cx="965" cy="220" r="112" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="92;128" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="965" cy="220" r="112" fill="none" stroke="#5eead4" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="92;128" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
    </circle>

    <path d="M965 92 L1068 128 L1068 218 C1068 290 1022 332 965 352 C908 332 862 290 862 218 L862 128 Z" fill="url(#shield)" stroke="url(#accent)" stroke-width="2.5"/>
    <path d="M965 108 L1052 139 L1052 218 C1052 278 1014 313 965 331 C916 313 878 278 878 218 L878 139 Z" fill="none" stroke="#1f6f66" stroke-width="1" opacity="0.6"/>

    <g filter="url(#softGlow)" opacity="0.35">
      <rect x="932" y="205" width="66" height="58" rx="12" fill="#5eead4"/>
    </g>
    <path d="M944 205 v-20 a21 21 0 0 1 42 0 v20" fill="none" stroke="#5eead4" stroke-width="5" stroke-linecap="round"/>
    <rect x="930" y="205" width="70" height="58" rx="12" fill="#0d2b31" stroke="#5eead4" stroke-width="2"/>
    <circle cx="965" cy="230" r="6" fill="#5eead4"/>
    <path d="M965 236 v13" stroke="#5eead4" stroke-width="4" stroke-linecap="round"/>

    <text x="965" y="402" text-anchor="middle" class="sans" font-size="23" fill="#e6edf7">Your machine</text>
    <text x="965" y="432" text-anchor="middle" class="sans" font-size="23" fill="#5eead4">stays yours</text>
  </g>

  <text x="40" y="442" class="mono" font-size="12" fill="#50617a">one binary  |  no daemon  |  no root</text>
  <text x="1160" y="442" text-anchor="end" class="mono" font-size="12" fill="#50617a">tier 1 native linux</text>
</svg>
