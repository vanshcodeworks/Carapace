[package]
name = "carapace-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.carapace-core]
path = "../crates/cara-core"

[[bin]]
name = "policy_parse"
path = "fuzz_targets/policy_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "spec_limits"
path = "fuzz_targets/spec_limits.rs"
test = false
doc = false
bench = false

# TODO(C7-integration): uncomment when the carapace-mcp parser lands.
# [[bin]]
# name = "mcp_frame"
# path = "fuzz_targets/mcp_frame.rs"
# test = false
# doc = false
# bench = false

[[bin]]
name = "report_json"
path = "fuzz_targets/report_json.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
