name: Release

# MANUAL ONLY. This workflow has no push, tag, or schedule trigger. A human
# must dispatch it. It builds release binaries and creates a DRAFT GitHub
# release with SHA256 checksums. It never publishes a release, never pushes a
# published tag, and never publishes to crates.io. Publishing and crates.io
# are deliberate human decisions.
#
# Honesty note: x86_64-unknown-linux-gnu is the only measured runtime. The
# musl and aarch64 jobs are COMPILE-ONLY checks here. No aarch64 runtime has
# been measured: the seccomp allowlist is compiled for x86_64 only and the
# filter kills by design on aarch64 (UNVERIFIED R1.4). Alternate distros are
# also unverified. A successful cross-build is not a support claim.
# See docs/platform-matrix.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            use_cross: false
          - target: x86_64-unknown-linux-musl
            use_cross: true
          - target: aarch64-unknown-linux-gnu
            use_cross: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build with host toolchain
        if: ${{ !matrix.use_cross }}
        run: >-
          cargo build --release --locked --target ${{ matrix.target }}
          -p carapace-cli -p carapace-mcp
      - name: Build with cross
        if: matrix.use_cross
        run: >-
          cross build --release --locked --target ${{ matrix.target }}
          -p carapace-cli -p carapace-mcp
      - name: Package binaries with SHA256 checksums
        run: |
          set -euo pipefail
          stage="artifacts/${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/cara" "$stage/"
          cp "target/${{ matrix.target }}/release/cara-mcp" "$stage/"
          (cd "$stage" && sha256sum cara cara-mcp > SHA256SUMS)
          tar -czf "artifacts/carapace-${{ matrix.target }}.tar.gz" -C "$stage" .
          (cd artifacts && sha256sum "carapace-${{ matrix.target }}.tar.gz" \
            > "carapace-${{ matrix.target }}.tar.gz.sha256")
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: carapace-${{ matrix.target }}
          path: |
            artifacts/carapace-${{ matrix.target }}.tar.gz
            artifacts/carapace-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: create draft release
    needs: build
    runs-on: ubuntu-24.04
    # workflow_dispatch is a human action. Keep the explicit guard so an
    # automated event can never create a release through this workflow.
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: carapace-*
          merge-multiple: true
      - name: Create draft release (not published, no crates.io)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: draft-${{ github.run_id }}
          name: Draft ${{ github.run_id }}
          draft: true
          prerelease: false
          generate_release_notes: false
          files: artifacts/*
