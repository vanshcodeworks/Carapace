# Carapace tmux config - optimized for development
# Save as ~/.tmux.conf

# Prefix: Ctrl+a (easier than Ctrl+b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Terminal
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g focus-events on

# History
set -g history-limit 50000

# Index from 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Mouse
set -g mouse on

# Vim mode
set -g mode-keys vi
set -g status-keys vi

# Copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Y send -X copy-line
bind -T copy-mode-vi Escape send -X cancel

# Paste
bind p paste-buffer

# Splits (intuitive: | for vertical, - for horizontal)
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Pane navigation (vim-like)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation
bind -r C-h previous-window
bind -r C-l next-window

# New window
bind c new-window -c "#{pane_current_path}"

# Kill pane/window
bind x kill-pane
bind X kill-window

# Status bar
set -g status on
set -g status-interval 2
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#0d1117,fg=#c9d1d9"

# Left status: session name
set -g status-left-length 30
set -g status-left "#[fg=#58a6ff,bg=#161b22,bold] #S #[fg=#161b22,bg=#0d1117]"

# Right status: time, date
set -g status-right-length 60
set -g status-right "#[fg=#30363d,bg=#0d1117]#[fg=#c9d1d9,bg=#30363d] %H:%M  %d-%b-%y "

# Window status
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#0d1117,bg=#58a6ff,bold] #I:#W #[fg=#58a6ff,bg=#0d1117]"
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#30363d"
set -g pane-active-border-style "fg=#58a6ff"

# Message style
set -g message-style "bg=#58a6ff,fg=#0d1117,bold"

# Clock
set -g clock-mode-colour "#58a6ff"
set -g clock-mode-style 24

# Activity monitoring
set -g monitor-activity on
set -g visual-activity off
set -g activity-action other

# Focus events for vim
set -g focus-events on

# Escape time (for vim)
set -sg escape-time 10

# Aggressive resize
setw -g aggressive-resize on

# Automatic rename
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"

# ==========================================
# Carapace-specific shortcuts
# ==========================================

# Quick test commands
bind t run-shell "tmux send-keys -t carapace:dev.1 'cargo test --workspace' Enter"
bind T run-shell "tmux send-keys -t carapace:dev.1 'bash scripts/check.sh' Enter"
bind c run-shell "tmux send-keys -t carapace:dev.1 'cargo check --workspace' Enter"
bind l run-shell "tmux send-keys -t carapace:dev.1 'cargo clippy --all-targets --all-features -- -D warnings' Enter"
bind f run-shell "tmux send-keys -t carapace:dev.1 'cargo fmt --all -- --check' Enter"

# Quick git
bind g new-window -n "git" -c "#{pane_current_path}" \; send-keys "git status" Enter

# Session management
bind S command-prompt -p "New session name:" "new-session -s '%%'"
bind K confirm-before -p "Kill session #S? (y/n)" kill-session

# ==========================================
# Layout presets
# ==========================================

# Dev layout: editor left, tests right
bind D \
  select-window -t carapace:dev \; \
  select-pane -t 0 \; \
  split-window -h -p 30 -c "#{pane_current_path}" \; \
  select-pane -t 0

# Three-pane: editor, tests, git
bind M \
  select-window -t carapace:dev \; \
  select-pane -t 0 \; \
  split-window -h -p 30 -c "#{pane_current_path}" \; \
  select-pane -t 0 \; \
  split-window -v -p 50 -c "#{pane_current_path}" \; \
  select-pane -t 2

