# A runnable network allowlist policy. Outbound connect(2) is allowed only
# to the destinations below, which are checked by a seccomp broker.
# Hostnames are not accepted: write the resolved IP or CIDR range.
preset = "dev"

[network]
mode = "allowlist"
allow = [
  "127.0.0.1:8080",
  "10.0.0.0/8:443",
  "[::1]:5432",
]
