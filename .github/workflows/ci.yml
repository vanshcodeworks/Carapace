name: CI

# Hosted runners here only prove compile, format, lint, dependency and unit
# behavior. They restrict unprivileged user namespaces and cgroup delegation,
# so environment-dependent isolation tests self-skip (CARA_STRICT_ENV_TESTS is
# unset). A green badge from this workflow is NOT proof of sandbox isolation.
# The authoritative full loop is scripts/check.sh on a cgroup-delegated host,
# run weekly by .github/workflows/self-hosted-check.yml. See
# docs/platform-matrix.md. This workflow intentionally makes no support claim
# for alternate distros or aarch64.

on:
  push:
    branches: [main, agent/work]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Note: hosted runners restrict unprivileged user namespaces, so
      # environment-dependent tests self-skip (CARA_STRICT_ENV_TESTS unset).
      - name: Docs check
        run: python3 scripts/check-docs.py
      - name: Shell syntax
        run: |
          bash -n scripts/check.sh
          bash -n scripts/install.sh
          bash -n demo/demo.sh
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace

  deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
