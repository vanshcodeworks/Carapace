# Alacritty config for Carapace development
# Save as ~/.config/alacritty/alacritty.toml

env:
  TERM: "xterm-256color"
  WINIT_UNIX_BACKEND: "x11"

window:
  dimensions:
    columns: 160
    lines: 48
  padding:
    x: 8
    y: 8
  decorations: "full"
  startup_mode: "Maximized"
  opacity: 0.98

scrolling:
  history: 50000
  multiplier: 3

font:
  normal:
    family: "JetBrains Mono"
    style: "Regular"
  bold:
    family: "JetBrains Mono"
    style: "Bold"
  italic:
    family: "JetBrains Mono"
    style: "Italic"
  bold_italic:
    family: "JetBrains Mono"
    style: "Bold Italic"
  size: 11.0
  offset:
    x: 0
    y: 0
  glyph_offset:
    x: 0
    y: 0
  use_thin_strokes: true

draw_bold_text_with_bright_colors: true

colors:
  primary:
    background: "0x0d1117"
    foreground: "0xc9d1d9"
  cursor:
    text: "0x0d1117"
    cursor: "0x58a6ff"
  vi_mode_cursor:
    text: "0x0d1117"
    cursor: "0xf78166"
  selection:
    text: "0xc9d1d9"
    background: "0x264f78"
  normal:
    black: "0x484f58"
    red: "0xff7b72"
    green: "0x3fb950"
    yellow: "0xd29922"
    blue: "0x58a6ff"
    magenta: "0xbc8cff"
    cyan: "0x39c5cf"
    white: "0xb1bac4"
  bright:
    black: "0x6e7681"
    red: "0xffa198"
    green: "0x56d364"
    yellow: "0xe3b341"
    blue: "0x79c0ff"
    magenta: "0xd2a8ff"
    cyan: "0x5de4e7"
    white: "0xc9d1d9"
  dim:
    black: "0x3d444d"
    red: "0xcc5d55"
    green: "0x2d8c3d"
    yellow: "0x9e6b00"
    blue: "0x388bfd"
    magenta: "0x8957e5"
    cyan: "0x2c9c9f"
    white: "0x8b949e"

selection:
  semantic_escape_chars: ",│`|:\"' ()[]{}<>"
  save_to_clipboard: true

cursor:
  style:
    shape: "Block"
    blinking: "On"
  blink_interval: 750
  unfocused_hollow: true

live_config_reload: true

shell:
  program: "/bin/bash"
  args:
    - "--login"

mouse:
  hide_when_typing: true

key_bindings:
  # Font size
  - { key: "Equals", mods: "Control", action: "IncreaseFontSize" }
  - { key: "Minus", mods: "Control", action: "DecreaseFontSize" }
  - { key: "Key0", mods: "Control", action: "ResetFontSize" }

  # Copy/Paste
  - { key: "C", mods: "Control|Shift", action: "Copy" }
  - { key: "V", mods: "Control|Shift", action: "Paste" }

  # New window/tab (tmux-style)
  - { key: "T", mods: "Control|Shift", action: "SpawnNewInstance" }

  # Search
  - { key: "F", mods: "Control|Shift", action: "SearchForward" }
  - { key: "B", mods: "Control|Shift", action: "SearchBackward" }

  # Scrollback
  - { key: "PageUp", mods: "Shift", action: "ScrollPageUp" }
  - { key: "PageDown", mods: "Shift", action: "ScrollPageDown" }
  - { key: "Home", mods: "Shift", action: "ScrollToTop" }
  - { key: "End", mods: "Shift", action: "ScrollToBottom" }

# URL handling
mouse:
  url:
    launcher: "xdg-open"
    modifiers: "Control"