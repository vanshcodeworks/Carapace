# cargo-deny policy for Carapace (deny.toml)
# Generated by `cargo deny init`, then given an explicit license policy.
# Every allowed license is an OSI-approved permissive license; anything
# else (copyleft, unlicensed, unknown) fails the check and requires a
# human decision. Re-run `cargo deny check licenses` after dependency
# changes; new licenses must be added here WITH a justification comment.

[graph]
all-features = true

[licenses]
version = 2
allow = [
    # The dominant licenses in the tree (cargo deny check licenses).
    # SPDX expressions on crates (e.g. "MIT OR Apache-2.0") are satisfied
    # when any side of the expression is allowed here.
    "MIT",
    "Apache-2.0",
    # BSD family (wasmtime, getrandom, libc support crates).
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Cranelift (wasmtime's codegen) uses Apache-2.0 WITH LLVM-exception,
    # the standard wasmtime license form.
    "Apache-2.0 WITH LLVM-exception",
    # Unicode data tables (unicode-ident, ICU crates pulled by clap/anstream).
    "Unicode-3.0",
    # Small utility licenses.
    "Zlib",
    # r-efi (wasmtime UEFI support) is a tri-license; the crate may also be
    # used under MIT OR Apache-2.0. Today no crate in the tree is ONLY
    # LGPL-licensed; if one appears, a human decides here.
    "LGPL-2.1-or-later",
]
# The tree contains no copyleft (GPL/AGPL) licenses today; if one appears,
# this check fails and a human decides.
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "warn"

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
